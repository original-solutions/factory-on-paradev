# The runner's machine config for this Mac: how the factory runs on local Paradev.
# Copy this file to ~/.config/factory-runner/config.yml (or config.yml in $FACTORY_RUNNER_HOME)
# and edit it; `factory-runner install` copies it there when there is
# none. The runner reads it at start. As it stands it watches no repo, so it claims nothing. No
# path here is expanded, so there is no `~`: write each one out in full.

# The gh login directory the runner's own GitHub calls act as (claims, labels, comments, the
# gate). Log in to it once with GH_CONFIG_DIR=<this directory> gh auth login. The agent sessions
# do not use it: Paradev starts them with this Mac's active gh login. Replace YOU with your user.
gh_config_dir: /Users/YOU/.config/factory-runner/gh

# Seconds between passes over GitHub. At least 10.
poll_seconds: 60

# Runs that may hold an issue at once, and gates that may run at once. A run holds a slot from
# its claim until its session reports its pull request or the run ends; the gate and the wait
# for required checks take no run slot. While t3fac still runs, keep both factories'
# max_concurrent_runs summed at or below t3fac's 3: they share one Claude account.
max_concurrent_runs: 1
max_concurrent_gates: 1

# Seconds between reads of a pr-open run's feedback (default 600); 0 reads on every pass.
feedback_seconds: 600

# The free GiB the disk holding the worktrees and this data must keep. Below it a pass claims no
# issue and starts no gate. 0 turns the check off. Defaults to 10.
min_free_gib: 10

# The 1-minute load per core above which a pass claims no issue and a second gate waits.
# 0 turns the check off. Defaults to 1.
max_load_per_core: 1

# A macOS notification when something needs a person.
notify: true

# A runner installed by `factory-runner install` checks this repo's v* tags every ten minutes,
# installs a newer one itself, and restarts into it after a pass when no gate runs. Defaults to true.
# Set it to false before going back to an older version with `make deploy TAG=...`, or the older
# runner installs the newer tag again.
self_update: true

# Must stay empty: Paradev cannot move a running session to another model through the CLI.
# model_fallbacks: {}

# A repo whose clone has no `factory` block is built on this block when it is set, with its
# provision and gate inferred from the package.json or composer.json on its default branch.
# default_project:
#   instructors: [your-login]
#   limits: { gate_retries: 2 }

# The repos this runner builds. `path` is a clone used only by the runner, added once to
# Paradev on this Mac:  superset projects create --local --name <name> --import <path>
# Every repo listed is watched and claimed on from the first pass. t3fac ignored a `repos:` list,
# so check one copied from a t3fac config: take each repo out of t3fac before it is listed here,
# one factory per repo. An entry looks like:
#   - repo: original-solutions/factory-paradev-spike
#     path: /Users/YOU/factory-runner/original-solutions/factory-paradev-spike
repos: []

# Where a repo may run: this Mac, other Paradev hosts, and Paradev Cloud. These keys are read and
# checked, but nothing acts on them yet: every launch runs on this Mac, up to
# max_concurrent_runs, and local.max_runs does not limit it. To set them, move these keys out of
# the comment: the repos entry goes in the list above, the other blocks stay at the top level.
# Config load makes no CLI call, so check each id yourself with `superset hosts list` and
# `superset environments list`.
# --- targets ---
# repos:
#   - repo: original-solutions/factory-paradev-spike
#     path: /Users/YOU/factory-runner/original-solutions/factory-paradev-spike
#     # Optional: the hosts this repo may run on, each with the repo's clone on that host.
#     hosts:
#       - id: c9c39956e0c1756e30d6bb9f4f907ff1
#         path: /Users/tomk/factory-runner/original-solutions/factory-paradev-spike
#     # Optional: a Paradev Cloud environment id that has this repo. Needs the cloud block.
#     cloud: edad9805-e48d-40f3-a06c-e19a4105f974
#
# # Every host a repo names must be here.
# hosts:
#   - id: c9c39956e0c1756e30d6bb9f4f907ff1
#     # As `superset hosts list` shows it; used in the belt and the log.
#     name: trilogy-mac
#     # user@host, a destination that works with ssh -o BatchMode=yes. An ssh config alias works
#     # as user@alias; a bare host name is refused, since BatchMode would guess the user.
#     ssh: tomk@trilogy-mac
#     # Runs this host may hold at once.
#     max_runs: 2
#     # The 1-minute load per core above which the host takes no run. 0 turns the check off.
#     # Defaults to 1.
#     max_load_per_core: 1
#
# # Present when some repo names a cloud environment.
# cloud:
#   # small | medium | large. Defaults to small.
#   machine_size: small
#   # Cloud runs at once, at most 3. Defaults to 1.
#   max_runs: 1
#   # The https:// Funnel address the org's Claude connection points at.
#   proxy: https://trilogy-mac.tail459612.ts.net:10000
#
# # This Mac as a target.
# local:
#   # Runs this Mac may hold at once, at most max_concurrent_runs, which is its default.
#   max_runs: 1
# --- end targets ---

paradev:
  # The superset CLI bundled with the Paradev app, which must stay open.
  cli: /Applications/Superset.app/Contents/Resources/resources/bin/superset
  # A preset id from `superset agents list --local`.
  agent: claude
  # Optional; passed as --model. Omitted: the agent's default.
  model: opus
  # Optional; passed as --effort.
  effort: high
  belt:
    enabled: true
    # just_me | org. org only when every member of the Paradev org can read every watched repo.
    visibility: just_me
